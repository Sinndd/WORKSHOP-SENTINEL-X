# Serveur NTP local pour l'ESP8266 (l'heure sert à valider les dates du certificat TLS).
# Le conteneur ne règle PAS l'horloge de l'hôte (chronyd -x) : il redistribue l'heure du Pi.
# Heure du Pi : chrony de l'hôte / module RTC DS3231 / `sudo date -s ...` (cf. docs/AUDIT-SECURITE.md §4).
local stratum 10
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12
cmdport 0
ratelimit interval 1 burst 16
