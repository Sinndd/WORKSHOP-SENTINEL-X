# Mosquitto — SENTINEL-X (Raspberry Pi 3 B+)
# MQTTS uniquement : aucun listener 1883, aucun accès anonyme.

allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# Pas de persistance disque : on ménage la carte SD. Les messages retained
# Les sessions QoS 1 restent en mémoire tant que le broker tourne.
persistence false

# Journaux vers stdout -> pilote json-file de Docker (rotation 2 x 5 Mo).
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Garde-fous mémoire / abus (payloads du contrat < 1 Ko).
max_packet_size 4096
max_inflight_messages 20
# File par client (ingestor) : absorbe une rafale sans perdre de QoS 0, bornée à 1 Mio.
max_queued_messages 1000
max_queued_bytes 1048576
max_keepalive 120
max_qos 1
sys_interval 30

# --- Listener MQTTS --------------------------------------------------------
listener 8883
protocol mqtt
# Peu de clients légitimes (esp32, ingestor, api, vision, healthcheck) : le reste est un abus.
max_connections 20
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
# TLS 1.2 minimum (l'ESP32/mbedTLS et les clients Python négocient 1.2 ou 1.3).
tls_version tlsv1.2
# Suites ECDHE-ECDSA (certificat P-256) supportées par mbedTLS (ESP32), AEAD en priorité.
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256
require_certificate false
